services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: palse
      POSTGRES_PASSWORD: palse
      POSTGRES_DB: palse
    ports:
      - "5432:5432"
    volumes:
      - palse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://palse:palse@db:5432/palse
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"

volumes:
  palse_pgdata:
